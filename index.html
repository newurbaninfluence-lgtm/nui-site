<script>
(function(){
  if(window.matchMedia('(max-width:768px)').matches||'ontouchstart' in window) return;
  var dot=document.querySelector('.cursor-dot'), ring=document.querySelector('.cursor-ring');
  if(!dot||!ring) return;
  document.body.classList.add('has-custom-cursor');
  var mx=0,my=0,rx=0,ry=0;
  document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
  function lerp(){rx+=(mx-rx)*0.15;ry+=(my-ry)*0.15;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(lerp);}
  lerp();
  document.addEventListener('mousedown',function(){dot.classList.add('clicking');ring.classList.add('clicking');});
  document.addEventListener('mouseup',function(){dot.classList.remove('clicking');ring.classList.remove('clicking');});
  document.addEventListener('mouseover',function(e){
    var t=e.target.closest('a,button,.btn-cta,.btn-outline,.btn-white,.btn-service,.service-card,.portfolio-card,.faq-toggle,input,textarea,select');
    if(t){dot.classList.add('hover');ring.classList.add('hover');return;}
    var txt=e.target.closest('p,h1,h2,h3,h4,h5,h6,span,li,.faq-answer-text');
    if(txt){dot.classList.add('text');ring.classList.add('text');}
  });
  document.addEventListener('mouseout',function(e){
    var t=e.target.closest('a,button,.btn-cta,.btn-outline,.btn-white,.btn-service,.service-card,.portfolio-card,.faq-toggle,input,textarea,select');
    if(t){dot.classList.remove('hover');ring.classList.remove('hover');}
    var txt=e.target.closest('p,h1,h2,h3,h4,h5,h6,span,li,.faq-answer-text');
    if(txt){dot.classList.remove('text');ring.classList.remove('text');}
  });
  document.addEventListener('mouseleave',function(){dot.style.opacity='0';ring.style.opacity='0';});
  document.addEventListener('mouseenter',function(){dot.style.opacity='1';ring.style.opacity='1';});
})();
</script>
